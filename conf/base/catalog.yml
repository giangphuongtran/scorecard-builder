# Raw Inputs (SAS Layer)
production_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/production.sas7bdat
  file_format: sas
  load_args:
    format: sas7bdat
    encoding: utf-8

transactions_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/transactions.sas7bdat
  file_format: sas
  load_args:
    format: sas7bdat
    encoding: utf-8

default_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/default.sas7bdat
