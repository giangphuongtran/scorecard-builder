# Raw Inputs (SAS Layer)
production_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/production.sas7bdat
  file_format: sas
  load_args:
    format: sas7bdat
    encoding: utf-8

transactions_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/transactions.sas7bdat
  file_format: sas
  load_args:
    format: sas7bdat
    encoding: utf-8

default_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/default.sas7bdat
  file_format: sas
  load_args:
    format: sas7bdat
    encoding: utf-8

# Intermediate Outputs (Parquet Layer)
production_parquet:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/production.parquet
  save_args:
    engine: pyarrow # or fastparquet
    index: False

transactions_parquet:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/transactions.parquet
  save_args:
    engine: pyarrow # or fastparquet
    index: False

default_parquet:
