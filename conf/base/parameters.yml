raw_paths:
  production: data/01_raw/production.sas7bdat
  transactions: data/01_raw/transactions.sas7bdat
  default: data/01_raw/default.sas7bdat

behavioral:
  max_length: 12
  window_lengths: [3, 6, 9, 12]
  stats: ["Mean", "Max", "Min"]
  base_vars:
    - CMaxI_Days
    - CMaxI_Due
    - CMaxC_Days
    - CMaxC_Due
    - CMaxA_Days
    - CMaxA_Due
  grace_days: 15
  nmiss_threshold: 1
  product_streams:
    - prefix: CMaxI
      product: ins
    - prefix: CMaxC
      product: css
    - prefix: CMaxA
      product: null
  start_period: "197502"
  end_period: "198712"

simulation:
  start_period: "197501"
  end_period: "198712"
  seed_period: "197501"
  burn_in_before: "197501"

binning:
  ncategories_int: 3
  minimum_share_int: 0.20
  ncategories_nom: 4
  symbol_missing: "Missing"
  symbol_other: "<OTHERS>"
  tree_random_state: 1234
  woe_epsilon: 1.0e-4
  nominal_int_threshold: 10

model:
  target: default12
  time_col: period
  id_col: aid
  train_end_period: "198412"
  valid_start_period: "198501"
  iv_min: 0.02
  gini_min: 0.05
  psi_max: 0.25
  ar_diff_max: 0.20
  pvalue_max: 0.05
  vif_max: 5.0
  pearson_max: 0.7
  ar_diff_model_max: 0.10
  max_features: 12
  epsilon: 1.0e-4
  factor: 28.8539007098   # 20 / ln(2)
  offset: 487.1194695278  # 600 - factor * ln(50)

# Notebook 05 / ASB tune — per-product overrides. Kedro scorecard still uses binning+model above.
# agr*/ags* stay in the ABT (bad_customer uses agr12_Max_CMaxA_Due) but are blocked from scorecards.
scorecard:
  prefixes: ["app", "act"]
  blocked: ["agr", "ags"]
  time_col: period
  id_col: aid
  train_end_period: "198512"
  valid_start_period: "198601"
  rare_threshold: 0.05
  symbol_missing: Missing
  symbol_other: "<OTHERS>"
  tree_random_state: 1234
  woe_epsilon: 1.0e-4
  nominal_int_threshold: 10
  number_vars: 12
  iv_min: 0.02
  psi_max: 0.25
  ar_diff_max: 0.20
  pvalue_max: 0.05
  vif_max: 3.0
  pearson_max: 0.75
  ar_diff_model_max: 0.20
  max_features: 12
  epsilon: 1.0e-4
  # Bin / WOE QC (03 notebook gates)
  max_bad_rate_swing: 0.75
  min_bin_n_period: 5
  min_bin_n_total: 30
  min_static_br_gap: 0.01
  min_period_br_gap: 0.01
  # Soft-drop QC fails from combo search by default; override per product to false if pool empties.
  soft_drop_qc_fails: true
  ins:
    target: default12
    ncategories_int: 4
    minimum_share_int: 0.20
    ncategories_nom: 4
    number_features: [5, 6, 7]
    gini_min: 0.05
    min_bin_n_period: 1
    max_bad_rate_swing: 1.0
  css:
    target: default12
    ncategories_int: 3
    minimum_share_int: 0.20
    ncategories_nom: 3
    number_features: [5, 6, 7, 8]
    gini_min: 0.05
  pr:
    target: cross_response
    ncategories_int: 3
    minimum_share_int: 0.12
    ncategories_nom: 3
    number_features: [4, 5, 6]
    gini_min: 0.02
  cross:
    # Combo search empty under soft-drop; keep QC as report lens for this product.
    soft_drop_qc_fails: false
    target: default_cross12
    ncategories_int: 3
    minimum_share_int: 0.20
    ncategories_nom: 3
    number_features: [4, 5, 6]
    gini_min: 0.02
    min_bin_n_period: 1
    min_bin_n_total: 15
    max_bad_rate_swing: 1.0
    min_static_br_gap: 0.001
    min_period_br_gap: 0.001


profit:
  window_start: "197501"
  window_end: "198712"
  burn_in_before: "197501"
  reference: 731882
  economics:
    ins:
      lgd: 0.45
      apr_annual: 0.01
      provision: 0.0
    css:
      lgd: 0.55
      apr_annual: 0.18
      provision: 0.0
  cutoffs:
    # Application PD. Mid-band requires pd_ins_low < pd <= pd_ins_high.
    # Frozen from as-if tune (~965k PLN on v6 scored frame).
    pd_css: 0.50
    pd_ins_high: 0.03
    pd_ins_low: 0.01
    pr_min: 0.028
    cross_pd_max: 0.2724
  bad_customer:
    enabled: true
    feature: agr12_Max_CMaxA_Due
    threshold: 3
  artifacts:
    ins:
      package: data/06_models/pd_ins_v6.pkl
      points: data/06_models/points_table_ins_v6.parquet
      calib: data/06_models/calibration_params_ins_v6.json
    css:
      package: data/06_models/pd_css_v6.pkl
      points: data/06_models/points_table_css_v6.parquet
      calib: data/06_models/calibration_params_css_v6.json
    pr:
      package: data/06_models/pr_css_v6.pkl
      points: data/06_models/points_table_pr_css_v6.parquet
      calib: data/06_models/calibration_params_pr_css_v6.json
    cross:
      package: data/06_models/cross_pd_css_v6.pkl
      points: data/06_models/points_table_cross_pd_css_v6.parquet
      calib: data/06_models/calibration_params_cross_pd_css_v6.json

# MLflow is on by default; set MLFLOW_ENABLE=0 to disable.
mlflow:
  enabled: true
  tracking_uri: sqlite:///mlruns.db
  experiment_name: credit_scoring

# Offline champion vs challenger on the frozen as-if scored frame.
ab_test:
  reference: 731882
  champion:
    name: cltv_production
    cutoffs:
      pd_css: 0.50
      pd_ins_high: 0.03
      pd_ins_low: 0.01
      pr_min: 0.028
      cross_pd_max: 0.2724
  challenger:
    name: looser_css
    cutoffs:
      pd_css: 0.55
      pd_ins_high: 0.03
      pd_ins_low: 0.01
      pr_min: 0.028
      cross_pd_max: 0.2724
